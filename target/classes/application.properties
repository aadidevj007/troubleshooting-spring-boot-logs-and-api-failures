spring.application.name=q34-student-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/studentsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:students_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
server.error.include-message=never
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
app.security.api-key=${APP_API_KEY:}
app.rate-limit.diagnostics.max-requests=${DIAGNOSTIC_RATE_LIMIT:30}
app.rate-limit.diagnostics.window-seconds=${DIAGNOSTIC_RATE_WINDOW_SECONDS:60}
