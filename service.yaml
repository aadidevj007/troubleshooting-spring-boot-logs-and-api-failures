apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: student-api
spec:
  selector:
    app: student-api
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: NodePort
